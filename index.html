<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal fan-made rules assistant for the board game Final Girl." />
    <!-- Always re-fetch this HTML so new deploys show up without clearing
         cache. The JS/CSS/images have content-hashed filenames, so they stay
         cacheable forever and only change when their contents change. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Home-screen / PWA icons + install metadata. %BASE_URL% is replaced by
         Vite with the correct path for wherever the app is hosted. -->
    <meta name="theme-color" content="#0a0708" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Final Girl — Rules Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
